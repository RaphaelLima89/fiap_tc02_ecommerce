services:
  mlflow:
    build: .
    entrypoint: []
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////app/mlruns/mlflow.db", "--default-artifact-root", "/app/mlruns/artifacts", "--allowed-hosts", "mlflow:5000,localhost:5000,localhost"]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app/mlruns

  train:
    build: .
    depends_on:
      - mlflow
    env_file:
      - .env
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      GIT_PYTHON_REFRESH: "quiet"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./metrics:/app/metrics
    command: ["scripts/train.py"]

volumes:
  mlflow_data:
